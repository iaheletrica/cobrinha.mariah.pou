<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Jogo da Cobrinha</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #581c87;
      color: white;
      overflow: hidden;
    }

    .game-container {
      width: 100%;
      max-width: 450px;
      padding: 15px;
      text-align: center;
    }

    h1 {
      margin: 0 0 15px;
      font-size: 28px;
    }

    .info {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      font-size: 14px;
    }

    .info p {
      margin: 0;
    }

    #restart {
      border: none;
      padding: 9px 12px;
      border-radius: 8px;
      background: white;
      color: #581c87;
      font-weight: bold;
      cursor: pointer;
    }

    #restart:active {
      transform: scale(0.95);
    }

    canvas {
      display: block;
      width: min(92vw, 400px);
      height: min(92vw, 400px);
      margin: 0 auto;
      background: #1f2937;
      border: 4px solid #374151;
      border-radius: 10px;
      touch-action: none;
    }

    .controles {
      margin-top: 15px;
      user-select: none;
      touch-action: none;
    }

    .btn-controle {
      width: 65px;
      height: 55px;
      margin: 4px;
      padding: 0;
      font-size: 25px;
      background: #7c3aed;
      color: white;
      border: 2px solid #a78bfa;
      border-radius: 12px;
      cursor: pointer;
      touch-action: manipulation;
    }

    .btn-controle:active {
      transform: scale(0.88);
      background: #6d28d9;
    }

    .instructions {
      margin: 12px 0 5px;
      color: #d1d5db;
      font-size: 13px;
    }

    #message {
      min-height: 24px;
      margin: 5px 0;
      font-size: 18px;
      font-weight: bold;
    }

    /* CELULARES PEQUENOS */

    @media (max-height: 700px) {
      .game-container {
        padding: 8px;
      }

      h1 {
        font-size: 23px;
        margin-bottom: 8px;
      }

      .controles {
        margin-top: 6px;
      }

      .btn-controle {
        width: 52px;
        height: 43px;
        font-size: 20px;
        margin: 2px;
      }

      .instructions {
        display: none;
      }
    }
  </style>
</head>

<body>

  <div class="game-container">

    <h1>🐍 Jogo da Cobrinha</h1>

    <div class="info">

      <p>
        Pontuação:
        <span id="score">0</span>
      </p>

      <p>
        🏆
        <span id="bestScore">0</span>
      </p>

      <button id="restart">
        Recomeçar
      </button>

    </div>

    <canvas id="game" width="400" height="400"></canvas>


    <!-- CONTROLES DO CELULAR -->

    <div class="controles">

      <div>
        <button
          class="btn-controle"
          id="cima"
          aria-label="Cima">
          ⬆️
        </button>
      </div>

      <div>

        <button
          class="btn-controle"
          id="esquerda"
          aria-label="Esquerda">
          ⬅️
        </button>

        <button
          class="btn-controle"
          id="baixo"
          aria-label="Baixo">
          ⬇️
        </button>

        <button
          class="btn-controle"
          id="direita"
          aria-label="Direita">
          ➡️
        </button>

      </div>

    </div>


    <p class="instructions">
      Use os botões ou deslize o dedo na tela.
    </p>

    <p id="message"></p>

  </div>


  <script>

    /* =========================
       ELEMENTOS
    ========================= */

    const canvas =
      document.getElementById("game");

    const ctx =
      canvas.getContext("2d");

    const scoreElement =
      document.getElementById("score");

    const bestScoreElement =
      document.getElementById("bestScore");

    const messageElement =
      document.getElementById("message");

    const restartButton =
      document.getElementById("restart");


    /* =========================
       CONFIGURAÇÕES
    ========================= */

    const tamanho = 20;

    const quantidade =
      canvas.width / tamanho;

    let cobra = [];

    let comida = null;

    let direcao = {
      x: 1,
      y: 0
    };

    let proximaDirecao = {
      x: 1,
      y: 0
    };

    let pontuacao = 0;

    let melhorPontuacao =
      Number(
        localStorage.getItem(
          "melhorPontuacao"
        )
      ) || 0;

    let jogoTerminou = false;

    let intervalo = null;


    bestScoreElement.textContent =
      melhorPontuacao;


    /* =========================
       INICIAR JOGO
    ========================= */

    function iniciarJogo() {

      cobra = [
        { x: 10, y: 10 }
      ];

      direcao = {
        x: 1,
        y: 0
      };

      proximaDirecao = {
        x: 1,
        y: 0
      };

      pontuacao = 0;

      jogoTerminou = false;

      scoreElement.textContent =
        pontuacao;

      messageElement.textContent =
        "";

      criarComida();

      clearInterval(intervalo);

      intervalo =
        setInterval(
          atualizarJogo,
          180
        );

      desenhar();
    }


    /* =========================
       CRIAR COMIDA
    ========================= */

    function criarComida() {

      const frutas = [
        "🍎",
        "🍌",
        "🍇",
        "🍓",
        "🍊"
      ];

      comida = {
        x: Math.floor(
          Math.random() * quantidade
        ),

        y: Math.floor(
          Math.random() * quantidade
        ),

        fruta:
          frutas[
            Math.floor(
              Math.random() *
              frutas.length
            )
          ]
      };


      const comidaNaCobra =
        cobra.some(
          parte =>
            parte.x === comida.x &&
            parte.y === comida.y
        );


      if (comidaNaCobra) {
        criarComida();
      }
    }


    /* =========================
       ATUALIZAR JOGO
    ========================= */

    function atualizarJogo() {

      if (jogoTerminou) {
        return;
      }


      direcao = proximaDirecao;


      const cabeca = {
        x:
          cobra[0].x +
          direcao.x,

        y:
          cobra[0].y +
          direcao.y
      };


      /* COLISÃO COM A PAREDE */

      if (
        cabeca.x < 0 ||
        cabeca.x >= quantidade ||
        cabeca.y < 0 ||
        cabeca.y >= quantidade
      ) {

        terminarJogo();

        return;
      }


      /* COLISÃO COM O CORPO */

      const bateuNoCorpo =
        cobra.some(
          parte =>
            parte.x === cabeca.x &&
            parte.y === cabeca.y
        );


      if (bateuNoCorpo) {

        terminarJogo();

        return;
      }


      cobra.unshift(cabeca);


      /* COMEU A COMIDA */

      if (
        cabeca.x === comida.x &&
        cabeca.y === comida.y
      ) {

        pontuacao++;

        scoreElement.textContent =
          pontuacao;


        /* MELHOR PONTUAÇÃO */

        if (
          pontuacao >
          melhorPontuacao
        ) {

          melhorPontuacao =
            pontuacao;

          localStorage.setItem(
            "melhorPontuacao",
            melhorPontuacao
          );

          bestScoreElement.textContent =
            melhorPontuacao;
        }


        criarComida();

      } else {

        cobra.pop();
      }


      desenhar();
    }


    /* =========================
       DESENHAR
    ========================= */

    function desenhar() {

      /* FUNDO */

      ctx.fillStyle =
        "#1f2937";

      ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      /* GRADE */

      ctx.strokeStyle =
        "#263244";

      for (
        let i = 0;
        i <= canvas.width;
        i += tamanho
      ) {

        ctx.beginPath();

        ctx.moveTo(i, 0);

        ctx.lineTo(
          i,
          canvas.height
        );

        ctx.stroke();


        ctx.beginPath();

        ctx.moveTo(0, i);

        ctx.lineTo(
          canvas.width,
          i
        );

        ctx.stroke();
      }


      /* COMIDA */

      ctx.font =
        "18px Arial";

      ctx.textAlign =
        "center";

      ctx.textBaseline =
        "middle";

      ctx.fillText(
        comida.fruta,

        comida.x * tamanho +
        tamanho / 2,

        comida.y * tamanho +
        tamanho / 2
      );


      /* COBRA */

      cobra.forEach(
        (parte, index) => {

          ctx.fillStyle =
            index === 0
              ? "#22c55e"
              : "#16a34a";


          ctx.beginPath();

          ctx.roundRect(
            parte.x * tamanho + 1,
            parte.y * tamanho + 1,
            tamanho - 2,
            tamanho - 2,
            6
          );

          ctx.fill();


          /* OLHOS */

          if (index === 0) {

            ctx.fillStyle =
              "white";


            ctx.beginPath();

            ctx.arc(
              parte.x * tamanho + 7,
              parte.y * tamanho + 6,
              4,
              0,
              Math.PI * 2
            );

            ctx.fill();


            ctx.beginPath();

            ctx.arc(
              parte.x * tamanho + 14,
              parte.y * tamanho + 6,
              4,
              0,
              Math.PI * 2
            );

            ctx.fill();


            /* PUPILAS */

            ctx.fillStyle =
              "black";


            ctx.beginPath();

            ctx.arc(
              parte.x * tamanho + 7,
              parte.y * tamanho + 6,
              2,
              0,
              Math.PI * 2
            );

            ctx.fill();


            ctx.beginPath();

            ctx.arc(
              parte.x * tamanho + 14,
              parte.y * tamanho + 6,
              2,
              0,
              Math.PI * 2
            );

            ctx.fill();
          }

        }
      );
    }


    /* =========================
       GAME OVER
    ========================= */

    function terminarJogo() {

      jogoTerminou = true;

      clearInterval(intervalo);

      messageElement.textContent =
        "💥 Game Over!";

    }


    /* =========================
       MUDAR DIREÇÃO
    ========================= */

    function mudarDirecao(x, y) {

      /* Impede a cobra de
         voltar diretamente */

      if (
        direcao.x === -x &&
        direcao.y === -y
      ) {
        return;
      }

      proximaDirecao = {
        x: x,
        y: y
      };
    }


    /* =========================
       TECLADO
    ========================= */

    document.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "ArrowUp"
        ) {

          event.preventDefault();

          mudarDirecao(0, -1);
        }


        if (
          event.key === "ArrowDown"
        ) {

          event.preventDefault();

          mudarDirecao(0, 1);
        }


        if (
          event.key === "ArrowLeft"
        ) {

          event.preventDefault();

          mudarDirecao(-1, 0);
        }


        if (
          event.key === "ArrowRight"
        ) {

          event.preventDefault();

          mudarDirecao(1, 0);
        }

      }
    );


    /* =========================
       BOTÕES DO CELULAR
    ========================= */

    document
      .getElementById("cima")
      .addEventListener(
        "pointerdown",
        function(event) {

          event.preventDefault();

          mudarDirecao(0, -1);
        }
      );


    document
      .getElementById("baixo")
      .addEventListener(
        "pointerdown",
        function(event) {

          event.preventDefault();

          mudarDirecao(0, 1);
        }
      );


    document
      .getElementById("esquerda")
      .addEventListener(
        "pointerdown",
        function(event) {

          event.preventDefault();

          mudarDirecao(-1, 0);
        }
      );


    document
      .getElementById("direita")
      .addEventListener(
        "pointerdown",
        function(event) {

          event.preventDefault();

          mudarDirecao(1, 0);
        }
      );


    /* =========================
       BOTÃO RECOMEÇAR
    ========================= */

    restartButton.addEventListener(
      "click",
      iniciarJogo
    );


    /* =========================
       CONTROLE POR DESLIZE
    ========================= */

    let inicioX = 0;
    let inicioY = 0;


    canvas.addEventListener(
      "touchstart",
      function(event) {

        const toque =
          event.touches[0];

        inicioX =
          toque.clientX;

        inicioY =
          toque.clientY;

      },
      { passive: true }
    );


    canvas.addEventListener(
      "touchend",
      function(event) {

        const toque =
          event.changedTouches[0];

        const finalX =
          toque.clientX;

        const finalY =
          toque.clientY;


        const diferencaX =
          finalX - inicioX;

        const diferencaY =
          finalY - inicioY;


        /* Ignora movimentos
           muito pequenos */

        if (
          Math.abs(diferencaX) < 20 &&
          Math.abs(diferencaY) < 20
        ) {
          return;
        }


        if (
          Math.abs(diferencaX) >
          Math.abs(diferencaY)
        ) {

          if (diferencaX > 0) {

            mudarDirecao(1, 0);

          } else {

            mudarDirecao(-1, 0);

          }

        } else {

          if (diferencaY > 0) {

            mudarDirecao(0, 1);

          } else {

            mudarDirecao(0, -1);

          }
        }

      },
      { passive: true }
    );


    /* =========================
       COMEÇAR
    ========================= */

    iniciarJogo();

  </script>

</body>
</html>
