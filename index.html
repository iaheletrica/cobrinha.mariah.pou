    .info p {
      margin: 0;
    }

    #restart {
      border: none;
      padding: 9px 12px;
      border-radius: 8px;
      background: white;
      color: #581c87;
      font-weight: bold;
      cursor: pointer;
    }

    #restart:active {
      transform: scale(0.95);
    }

    canvas {
      display: block;
      width: min(92vw, 400px);
      height: min(92vw, 400px);

      background: #1f2937;
      border: 4px solid #374151;
      border-radius: 10px;
      touch-action: none;
